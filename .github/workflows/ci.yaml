name: CI
on:
  push:

jobs:
  build:
    strategy:
      matrix:
        cabal: ["3.14.2.0"]
        # We do not yet have a definitive GHC version support policy (see #17).
        # Our current practice is to support at least the three most recent
        # versions of GHC. We keep old versions in CI as long as doing so causes
        # no undue burden.
        #
        # Be sure to update full-test.yaml when updating these.
        ghc: ["9.6.2", "9.8.2", "9.10.1", "9.12.2", "9.14.1"]
        os: ["ubuntu-24.04"]
      fail-fast: false
    uses: GaloisInc/.github/.github/workflows/haskell-ci.yml@v2
    with:
      cabal: ${{ matrix.cabal }}
      check: false
      # See Note [Parallelism] in `haskell-ci.yml` for why `--ghc-options='-j'`
      # and `--semaphore`.
      configure-flags: --enable-tests --ghc-options='-Wall -Werror -j' --semaphore
      ghc: ${{ matrix.ghc }}
      os: ${{ matrix.os }}
      submodules: "true"
      pre-hook: |
        # Install pinned compiler versions for test fixture compilation.
        # Versions are pinned in tests/install-compilers.sh, which is also
        # used by tests/Dockerfile to keep both environments in sync.
        sudo bash tests/install-compilers.sh
        ln -s cabal.project.dist                 cabal.project
        ln -s cabal.ghc-${{ matrix.ghc }}.config cabal.project.freeze
